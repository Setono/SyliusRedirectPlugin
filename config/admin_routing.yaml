setono_sylius_redirect_admin_redirect_check_source:
    path: /redirects/check-source
    methods: [GET]
    controller: 'Setono\SyliusRedirectPlugin\Controller\Admin\CheckSourceAction'

setono_sylius_redirect_admin_redirect:
    resource: |
        alias: setono_sylius_redirect.redirect
        section: admin
        permission: true
        templates: "@SyliusAdmin\\shared\\crud"
        redirect: update
        grid: setono_sylius_redirect_admin_redirect
    type: sylius.resource
