            source_placeholder: /en_US/redirect-from
            keep_query_string: Mantieni la query string
            keep_query_string_help: 'Se abilitato, il redirect manterrà la query string, ad es. /en_US/redirect-from?q=ts ti reindirizzerà alla destinazione mantenendo tutti i parametri della query: /en_US/redirect-to?q=ts'
